server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: любые маршруты отдаём в index.html (роутинг на клиенте)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Долгий кэш для собранных ассетов (имена файлов содержат хэш)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
