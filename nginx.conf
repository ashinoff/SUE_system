server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: любые маршруты отдаём в index.html (роутинг на клиенте)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html НИКОГДА не кэшируем: после каждого редеплоя он ссылается на
    # новые хэши ассетов. Протухший закэшированный index.html указывает на
    # уже несуществующие /assets/*.js — отсюда «работает только в инкогнито».
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Долгий кэш для собранных ассетов (имена файлов содержат хэш)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
